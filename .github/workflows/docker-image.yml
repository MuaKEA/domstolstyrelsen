name: Build and push image

on:
  push:
    branches:
      - staging
      - test
      - prod
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: altair2400
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: image
        run: |
          case "$GITHUB_REF_NAME" in
            staging) echo "tag=stageLatest" >> "$GITHUB_OUTPUT" ;;
            test) echo "tag=testLatest" >> "$GITHUB_OUTPUT" ;;
            prod) echo "tag=prodLatest" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: altair2400/domstolsstyrelsen:${{ steps.image.outputs.tag }}

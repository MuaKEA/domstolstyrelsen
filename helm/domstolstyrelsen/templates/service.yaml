apiVersion: v1
kind: Service
metadata:
  name: domstolstyrelsen
  namespace: {{ .Values.namespace }}
  labels:
    app: domstolstyrelsen
spec:
  type: NodePort
  selector:
    app: domstolstyrelsen
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}

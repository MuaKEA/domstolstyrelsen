apiVersion: apps/v1
kind: Deployment
metadata:
  name: domstolstyrelsen
  namespace: {{ .Values.namespace }}
  labels:
    app: domstolstyrelsen
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: domstolstyrelsen
  template:
    metadata:
      labels:
        app: domstolstyrelsen
    spec:
      nodeSelector:
        environment: {{ .Values.namespace }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
